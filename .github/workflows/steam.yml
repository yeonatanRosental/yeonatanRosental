name: Update Steam activity

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/steam.yml
      - scripts/update_steam.py

permissions:
  contents: write

concurrency:
  group: profile-steam
  cancel-in-progress: false

jobs:
  steam:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate Steam activity card
        run: python3 scripts/update_steam.py

      - name: Commit updated Steam card
        env:
          STEAM_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          steam_snapshot=$(mktemp)
          trap 'rm -f "$steam_snapshot"' EXIT
          cp assets/steam.svg "$steam_snapshot"
          for attempt in 1 2 3; do
            # Apply only the generated asset to the latest remote history.
            git fetch origin "refs/heads/${STEAM_BRANCH}"
            git reset --hard FETCH_HEAD
            mkdir -p assets
            cp "$steam_snapshot" assets/steam.svg
            git add assets/steam.svg
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update Steam activity card"
            if git push origin "HEAD:refs/heads/${STEAM_BRANCH}"; then exit 0; fi
            echo "Push attempt ${attempt} failed; refreshing remote history."
          done
          echo "::error::Could not publish Steam activity after three attempts."
          exit 1
