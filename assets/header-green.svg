<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Yeonatan Rosental — Full Stack Developer</title>
  <desc id="desc">Green sci-fi terminal with a scanning grid, rotating orbital display, and softly glowing name. MERN and TypeScript.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#183729" stroke-width=".6"/></pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0H4" stroke="#000" stroke-opacity=".18"/></pattern>
    <linearGradient id="beam"><stop stop-color="#86efac" stop-opacity="0"/><stop offset=".9" stop-color="#86efac" stop-opacity=".07"/><stop offset="1" stop-color="#86efac" stop-opacity=".3"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#2a8851" stop-opacity=".18"/><stop offset="1" stop-color="#07100d" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="panel"><rect x="1" y="1" width="898" height="318" rx="12"/></clipPath>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .orbit{transform-origin:748px 155px;animation:orbit 28s linear infinite}
    .counter{transform-origin:748px 155px;animation:orbit 42s linear infinite reverse}
    .beam{animation:scan 9s linear infinite}
    .pulse{animation:breathe 5s ease-in-out infinite}
    .cursor{animation:breathe 2.5s ease-in-out infinite}
    .flow{stroke-dasharray:12 210;animation:flow 8s linear infinite}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes scan{from{transform:translateX(-180px)}to{transform:translateX(1060px)}}
    @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes flow{to{stroke-dashoffset:-444}}
    @media(prefers-reduced-motion:reduce){.orbit,.counter,.beam,.pulse,.cursor,.flow{animation:none}.beam{opacity:0}}
  </style>
  <g clip-path="url(#panel)">
    <rect width="900" height="320" fill="#07100d"/>
    <rect width="900" height="320" fill="url(#grid)" opacity=".5"/>
    <ellipse cx="700" cy="160" rx="340" ry="220" fill="url(#halo)"/>
    <rect class="beam" x="0" y="44" width="150" height="232" fill="url(#beam)"/>
    <path d="M0 44H900M0 276H900" stroke="#224232"/>
    <path d="M36 16h6v12h-6z" fill="#86efac" class="pulse"/>
    <text x="55" y="27" font-size="10" fill="#8caa96" letter-spacing="2">YR / DEVELOPER TERMINAL</text>
    <text x="865" y="27" text-anchor="end" font-size="10" fill="#86efac" letter-spacing="2">〈 / 〉</text>
    <path d="M34 94V70h30M592 70h28v24M34 220v24h30M592 244h28v-24" fill="none" stroke="#3c7951"/>
    <text x="55" y="104" font-size="11" fill="#6ea481" letter-spacing="2">IDENTITY / yeonatanRosental</text>
    <text x="52" y="154" font-size="39" font-weight="700" letter-spacing="-1.3" fill="#86efac" filter="url(#glow)">Yeonatan Rosental</text>
    <text x="55" y="188" font-size="18" fill="#d6eddd">Full Stack Developer</text>
    <rect x="286" y="174" width="8" height="17" fill="#86efac" class="cursor"/>
    <text x="55" y="220" font-size="11" fill="#91b49c" letter-spacing="1.5">MERN STACK  /  TYPESCRIPT</text>
    <g fill="none" stroke="#367e50">
      <circle cx="748" cy="155" r="89" stroke-dasharray="1 8"/>
      <circle class="orbit" cx="748" cy="155" r="76" stroke="#86efac" stroke-width="2" stroke-dasharray="70 35 8 35" opacity=".8"/>
      <circle class="counter" cx="748" cy="155" r="61" stroke-dasharray="20 12" opacity=".6"/>
      <circle cx="748" cy="155" r="46" stroke="#294d37"/>
      <path d="M644 155h29m150 0h29M748 51v29m0 150v29"/>
      <path class="orbit" d="M748 155V79" stroke="#86efac" opacity=".3"/>
      <path d="M724 142l-13 13 13 13m48-26 13 13-13 13m-18-30-12 60" stroke="#a3ffbc" stroke-width="2"/>
    </g>
    <circle cx="748" cy="79" r="3" fill="#b8ffcb" class="pulse"/>
    <path d="M35 263h830" stroke="#1c3c2a"/>
    <path d="M35 263h830" stroke="#86efac" class="flow"/>
    <text x="35" y="302" font-size="10" fill="#719e80" letter-spacing="1.2">INTERFACE → LOGIC → DATA</text>
    <text x="865" y="302" text-anchor="end" font-size="10" fill="#719e80" letter-spacing="1.2">[ TS / C / PY / JAVA ]</text>
    <rect width="900" height="320" fill="url(#scanlines)" pointer-events="none"/>
  </g>
  <rect x=".5" y=".5" width="899" height="319" rx="12" fill="none" stroke="#29503a"/>
</svg>
