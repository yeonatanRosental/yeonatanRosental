<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130" role="img" aria-labelledby="title desc">
  <title id="title">MERN stack with TypeScript</title>
  <desc id="desc">Animated green connections link React, Node.js with Express, and MongoDB.</desc>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .signal{stroke-dasharray:16 104;animation:transmit 3.5s linear infinite}
    @keyframes transmit{to{stroke-dashoffset:-120}}
    @media(prefers-reduced-motion:reduce){.signal{animation:none}}
  </style>
  <rect width="900" height="130" rx="10" fill="#09130e"/>
  <g fill="none" stroke="#29503a">
    <path d="M254 62h120m152 0h120"/>
    <path class="signal" d="M254 62h120m152 0h120" stroke="#86efac" stroke-width="2"/>
    <path d="M55 30h199v65H55zM374 30h152v65H374zM646 30h199v65H646z"/>
    <path d="M55 40V30h10m179 0h10v10M374 40V30h10m132 0h10v10M646 40V30h10m179 0h10v10" stroke="#86efac"/>
  </g>
  <g text-anchor="middle">
    <g font-size="10" fill="#729780" letter-spacing="2"><text x="155" y="50">INTERFACE</text><text x="450" y="50">SERVER</text><text x="745" y="50">DATA</text></g>
    <g font-size="16" fill="#b8f7cb"><text x="155" y="76">React</text><text x="450" y="76">Node + Express</text><text x="745" y="76">MongoDB</text></g>
    <text x="450" y="117" font-size="9" fill="#6da880" letter-spacing="2">〈 TYPESCRIPT / FULL STACK 〉</text>
  </g>
</svg>
